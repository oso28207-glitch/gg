name: Daily Episode Updater

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم الساعة 2 صباحاً
  workflow_dispatch:       # للتشغيل اليدوي

permissions:
  contents: write          # تكفي لإنشاء الإصدارات ودفع التغييرات

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 json5 PyGithub

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py

      - name: Commit and push changes (metadata.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metadata.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي للميتاداتا: $(date)"
          git push

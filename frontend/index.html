<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسلسلات تركية مدبلجة - 240p</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 مسلسلات تركية مدبلجة (جودة خفيفة 240p)</h1>
        <p style="color:#aaa;font-size:14px;">اختر مسلسلاً لعرض حلقاته</p>
    </header>
    <main id="app">
        <div class="loading">⏳ جاري تحميل البيانات...</div>
    </main>
    <div id="videoContainer" class="video-container">
        <h3 id="videoTitle"></h3>
        <div id="progressArea">
            <progress id="compressProgress" value="0" max="100"></progress>
            <span id="progressText">0%</span>
        </div>
        <video id="player" controls></video>
        <button id="closeVideo" onclick="closeVideo()">✕ إغلاق</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
